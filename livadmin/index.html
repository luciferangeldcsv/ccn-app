<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Vardiya Listesi · DEV Paneli</title>
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vardiya Listesi · DEV">
<style>
:root { --bg: #0d1117; --panel: #151b23; --panel2: #1c242e; --line: #2a3441; --fg: #e6edf3; --muted: #8b98a7; --acc: #58a6ff; --ok: #3fb950; --bad: #f85149; --warn: #d29922; --vio: #a371f7; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--acc); } .btn.pri { background: var(--acc); color: #04111f; border-color: var(--acc); font-weight: 600; } .btn.red { color: var(--bad); border-color: #5a2422; } .btn.sm { padding: 3px 8px; font-size: 12px; }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
input:focus, select:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
#login { max-width: 360px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
#login h1 { margin: 0; font-size: 20px; } #login label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }
#app { display: none; min-height: 100vh; }
aside { position: fixed; inset: 0 auto 0 0; width: 220px; background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; }
aside .brand { font-weight: 700; padding: 4px 10px 12px; letter-spacing: .02em; } aside .brand small { display: block; color: var(--vio); font-size: 11px; letter-spacing: .12em; }
aside button { text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; }
aside button[aria-current="true"] { background: var(--panel2); color: var(--fg); box-shadow: inset 3px 0 0 var(--acc); }
aside .sp { flex: 1; }
main { margin-left: 220px; padding: 20px 24px 60px; max-width: 1500px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; } .top h2 { margin: 0; font-size: 20px; flex: 1; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-size: 12px; } .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: p 1.6s infinite; }
@keyframes p { 50% { opacity: .3; } }
.ftabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.ftab { background: var(--panel); border: 1px solid var(--line); color: var(--mut, #9aa7b4); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.ftab:hover { color: #fff; }
.ftab.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.fcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.fcard .thumb { height: 150px; background: #0d1117 center/cover no-repeat; display: grid; place-items: center; position: relative; }
.fcard .thumb a.full { position: absolute; inset: 0; z-index: 1; } .fcard .thumb .pdf { font-size: 40px; color: #fff; text-shadow: 0 1px 6px #000; } .fcard .thumb video { width: 100%; height: 100%; object-fit: cover; }
.fcard .meta { padding: 8px 10px; font-size: 12px; display: grid; gap: 3px; }
.fcard .meta b { font-size: 13px; } .fcard .who { color: var(--muted); }
.fcard .acts { display: flex; gap: 6px; padding: 0 10px 10px; } .fcard .acts .btn { flex: 1; padding: 6px; font-size: 12px; }
.badge-ban { background: #7f1d1d; color: #fff; border-radius: 6px; padding: 1px 6px; font-size: 11px; }
.badge-uyari { background: #5a3d10; color: #f0c674; border-radius: 6px; padding: 1px 6px; font-size: 11px; }
.fcard .acts + .acts { padding-top: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; } .tile b { display: block; font-size: 26px; } .tile span { color: var(--muted); font-size: 12px; }
.tile.bad b { color: var(--bad); } .tile.ok b { color: var(--ok); } .tile.warn b { color: var(--warn); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; } .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th { text-align: left; color: var(--muted); font-weight: 600; padding: 7px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; } tr:hover td { background: var(--panel2); }
.tw { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; } .mut { color: var(--muted); } .nw { white-space: nowrap; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
.t-dev { color: var(--vio); border-color: #4b3474; } .t-yonetici { color: var(--acc); } .t-mudur { color: #39c5bb; } .t-sef { color: var(--warn); }
.a-giris { color: var(--ok); } .a-giris-hatali, .a-giris-bilinmeyen, .a-ip-engellendi { color: var(--bad); } .a-personel-silindi { color: #ff7b72; } .a-liste-yayinlandi, .a-duyuru { color: var(--acc); } .a-personel-guncellendi { color: var(--warn); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 10px; } .bars .b { flex: 1; display: grid; align-items: end; gap: 2px; text-align: center; font-size: 10px; color: var(--muted); }
.bars .col { display: flex; flex-direction: column-reverse; gap: 1px; height: 110px; justify-content: flex-start; } .bars .g { background: var(--acc); border-radius: 3px 3px 0 0; } .bars .h { background: var(--bad); border-radius: 3px 3px 0 0; }
.hb { display: grid; grid-template-columns: 110px 1fr 36px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; } .hb i { display: block; height: 10px; border-radius: 5px; background: var(--acc); }
.new td { animation: hl 2.5s ease; } @keyframes hl { from { background: #1f3a5c; } }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 20px; z-index: 9; } .modal > div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; max-width: 95vw; max-height: 90vh; overflow: auto; }
.c-1 { background: #1f4a2a; color: #9be3ad; } .c-2 { background: #5a3420; color: #f7bf98; } .c-3 { background: #4d4114; color: #f3d877; } .c-OFF { background: #d32f2f; color: #fff; } .c-YI, .c-UI, .c-R, .c-MI { background: #1e3a57; color: #a9d0f5; }
td.c { text-align: center; font-weight: 700; padding: 3px; min-width: 30px; }
#topbar { display: none; }
#drawer-bg { display: none; }
aside #install { color: var(--ok); } aside #install[hidden] { display: none; }
@media (max-width: 860px) {
  #topbar { display: flex; position: sticky; top: 0; z-index: 8; align-items: center; gap: 10px; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 14px; }
  #topbar .mb { font-size: 22px; background: none; border: 0; color: var(--fg); cursor: pointer; padding: 2px 6px; line-height: 1; }
  #topbar b { font-size: 15px; } #topbar small { color: var(--vio); font-size: 10px; letter-spacing: .1em; margin-left: 4px; }
  aside { transform: translateX(-100%); transition: transform .22s ease; width: 260px; z-index: 20; box-shadow: 4px 0 24px #0008; }
  body.nav-open aside { transform: none; }
  body.nav-open #drawer-bg { display: block; position: fixed; inset: 0; background: #0009; z-index: 15; }
  main { margin-left: 0; padding: 14px; }
  .grid2 { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .fgrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .hb { grid-template-columns: 90px 1fr 32px; }
  .top h2 { font-size: 18px; }
}
</style>
</head>
<body>
<form id="login" autocomplete="off">
  <h1>Giriş</h1>
  <label>Ad Soyad<input id="k" required></label>
  <label>Şifre<input id="p" type="password" maxlength="64" required></label>
  <div class="err" id="le"></div>
  <button class="btn pri">Giriş</button>
</form>
<div id="app">
  <div id="topbar"><button class="mb" id="mbtn" aria-label="Menü">☰</button><b>Vardiya Listesi</b><small>DEV</small></div>
  <div id="drawer-bg"></div>
  <aside>
    <div class="brand">Vardiya Listesi<small>DEV PANELİ</small></div>
    <button data-v="ozet">📊 Genel bakış</button>
    <button data-v="log">🟢 Canlı loglar</button>
    <button data-v="den">🧾 Denetim kaydı</button>
    <button data-v="kul">👥 Kullanıcılar</button>
    <button data-v="ot">💻 Oturumlar</button>
    <button data-v="yay">🗂️ Yayın geçmişi</button>
    <button data-v="duy">📣 Duyurular</button>
    <button data-v="dos">🖼️ Dosyalar</button>
    <button data-v="guv">🛡️ Güvenlik</button>
    <button data-v="ai">🤖 Yapay zekâ</button>
    <button data-v="luci">⭐ Nova sohbetleri</button>
    <div class="sp"></div>
    <button id="install" hidden>⬇️ Ana ekrana ekle</button>
    <button id="out">⎋ Çıkış</button>
  </aside>
  <main id="m"></main>
</div>
<script>
'use strict';
const API = '../api.php?r=', KEY = 'ccn-livadmin';
let tok = null; try { tok = localStorage.getItem(KEY); } catch (e) {}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (t) => { if (!t) return '–'; const d = new Date(t); const p = (n) => String(n).padStart(2, '0'); return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const TITLE = { dev: 'DEV', yonetici: 'Yönetici', mudur: 'Müdür', sef: 'Şef', personel: 'Personel' };
const ACT = { 'dosya-silindi': 'dosya sildi', 'dosya-uygunsuz': 'uygunsuz dosya sildi', 'egitim-eklendi': 'eğitim/not ekledi', 'egitim-guncellendi': 'eğitim/not güncelledi', 'egitim-silindi': 'eğitim/not sildi', 'sikayet-acildi': 'şikayet bildirdi', 'sikayet-cozuldu': 'şikayeti çözdü', 'yeni-cihaz': 'yeni cihazdan giriş', 'sifre-degisti': 'şifresini değiştirdi', 'gorev-eklendi': 'görev ekledi', 'gorev-guncellendi': 'görev güncelledi', 'gorev-silindi': 'görev sildi', giris: 'giriş yaptı', cikis: 'çıkış yaptı', 'giris-hatali': 'hatalı giriş', 'giris-bilinmeyen': 'bilinmeyen hesapla giriş denemesi', 'sifre-olusturuldu': 'şifresini belirledi', 'liste-yayinlandi': 'liste yayınladı', 'taslak-onaya': 'listeyi onaya gönderdi', 'taslak-silindi': 'taslağı sildi', 'personel-eklendi': 'kişi ekledi', 'personel-guncellendi': 'kişi güncelledi', 'personel-silindi': 'kişi sildi', 'personel-toplu': 'toplu kişi ekledi', 'sifre-sifirlandi': 'şifre sıfırladı', duyuru: 'duyuru yayınladı', 'duyuru-silindi': 'duyuru sildi', ayar: 'ayarları değiştirdi', kurulum: 'kurulum', 'yonetici-cli': 'sunucudan hesap işlemi', 'ip-engellendi': 'IP engelledi', 'ip-engeli-kalkti': 'IP engelini kaldırdı', 'hesap-askiya': 'hesabı askıya aldı', 'hesap-acildi': 'hesabı açtı', 'giris-askida': 'askıdaki hesapla giriş denedi' };
const tag = (t) => t ? `<span class="tag t-${esc(t)}">${esc(TITLE[t] || t)}</span>` : '';
async function api(r, body) {
  const res = await fetch(API + r, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', ...(tok ? { 'X-Ccn-Token': tok } : {}) }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = null; try { j = await res.json(); } catch (e) {}
  if (res.status === 401 && j && j.cikis) { logout(); throw new Error('Oturum kapandı'); }
  if (!res.ok || !j || j.hata) throw new Error((j && j.hata) || 'Sunucu hatası ' + res.status);
  return j;
}
function logout() { try { localStorage.removeItem(KEY); } catch (e) {} if (tok) fetch(API + 'cikis', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Ccn-Token': tok }, body: '{}' }).catch(() => {}); tok = null; clearInterval(timer); $('#app').style.display = 'none'; $('#login').style.display = 'grid'; }
$('#login').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#le').textContent = '';
  try {
    const j = await api('giris', { istemci: 2, kimlik: $('#k').value.trim(), pin: $('#p').value, hatirla: false });
    if (!j.token) throw new Error('Önce siteden giriş yapıp şifrenizi belirleyin ya da güncelleyin.');
    if (!j.ben || j.ben.unvan !== 'dev') { tok = j.token; logout(); throw new Error('Bu panele erişim yetkiniz yok.'); }
    tok = j.token; try { localStorage.setItem(KEY, tok); } catch (e) {}
    start();
  } catch (err) { $('#le').textContent = err.message; }
});
$('#out').addEventListener('click', logout);
// mobil kayar menü
const closeNav = () => document.body.classList.remove('nav-open');
$('#mbtn') && $('#mbtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
$('#drawer-bg') && $('#drawer-bg').addEventListener('click', closeNav);
document.querySelectorAll('aside [data-v]').forEach((b) => b.addEventListener('click', () => { show(b.dataset.v); closeNav(); }));
// ana ekrana ekle (PWA)
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; const el = $('#install'); if (el) el.hidden = false; });
window.addEventListener('appinstalled', () => { const el = $('#install'); if (el) el.hidden = true; });
const standalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
const iOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
$('#install') && $('#install').addEventListener('click', async () => {
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $('#install').hidden = true; return; }
  alert(iOS() ? 'iPhone/iPad: Safari’de alttaki Paylaş düğmesine dokunun → “Ana Ekrana Ekle”.' : 'Tarayıcının menüsünden (⋮) “Uygulamayı yükle / Ana ekrana ekle” seçin.');
});
if (!standalone() && (iOS() || window.matchMedia('(max-width: 860px)').matches)) { const el = $('#install'); if (el) el.hidden = false; }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
let view = 'ozet', timer = null, lastLog = 0, logs = [], fsek = 'tumu';
async function start() {
  try { const j = await api('ben'); if (j.ben.unvan !== 'dev') { logout(); return; } } catch (e) { logout(); return; }
  $('#login').style.display = 'none'; $('#app').style.display = 'block'; show(location.hash.slice(1) || 'ozet');
}
function show(v) {
  view = v; location.hash = v; clearInterval(timer); $('#m').onclick = null; $('#m').onchange = null;
  document.querySelectorAll('aside [data-v]').forEach((b) => b.setAttribute('aria-current', String(b.dataset.v === v)));
  ({ ozet, log: logView, den, kul, dos, ot, yay, duy, guv, ai, luci: luciView }[v] || ozet)();
}
const M = (h) => { $('#m').innerHTML = h; };
const fail = (e) => M(`<div class="card err">${esc(e.message)}</div>`);

async function ozet() {
  const load = async () => {
    let d; try { d = await api('dev-ozet'); } catch (e) { return fail(e); }
    const max = Math.max(1, ...d.gunluk.map((x) => x.giris + x.hatali));
    const hb = (obj) => { const e = Object.entries(obj).sort((a, b) => b[1] - a[1]); const mx = Math.max(1, ...e.map((x) => x[1])); return e.map(([k, n]) => `<div class="hb"><span>${esc(k)}</span><i style="width:${(n / mx) * 100}%"></i><b>${n}</b></div>`).join('') || '<p class="mut">Açık oturum yok</p>'; };
    if (view !== 'ozet') return;
    M(`<div class="top"><h2>Genel bakış</h2><span class="live"><i></i>30 sn'de bir yenilenir</span></div>
      <div class="tiles">
        <div class="tile"><b>${d.kisi}</b><span>Kullanıcı</span></div>
        <div class="tile ok"><b>${d.cevrimici}</b><span>Son 15 dk aktif</span></div>
        <div class="tile"><b>${d.aktifOturum}</b><span>Açık oturum</span></div>
        <div class="tile"><b>${d.girisBugun}</b><span>Bugün giriş</span></div>
        <div class="tile"><b>${d.giris7}</b><span>7 günde giriş</span></div>
        <div class="tile ${d.hatali24 ? 'bad' : ''}"><b>${d.hatali24}</b><span>24 sa hatalı giriş</span></div>
        <div class="tile"><b>${d.ip24}</b><span>24 sa farklı IP</span></div>
        <div class="tile ${d.rl24 ? 'warn' : ''}"><b>${d.rl24}</b><span>24 sa aşırı istek</span></div>
        <div class="tile ${d.ban ? 'bad' : ''}"><b>${d.ban}</b><span>Engelli IP</span></div>
        <div class="tile"><b>${d.yayinSayisi}</b><span>Yayınlanan liste</span></div>
        <div class="tile"><b>${d.duyuruSayisi}</b><span>Duyuru</span></div>
        <div class="tile ${d.taslak ? 'warn' : ''}"><b>${d.taslak ? 'Var' : 'Yok'}</b><span>Onay bekleyen taslak</span></div>
      </div>
      <div class="grid2">
        <div class="card"><h3>Son 14 gün · giriş <span style="color:var(--acc)">■</span> hatalı <span style="color:var(--bad)">■</span></h3>
          <div class="bars">${d.gunluk.map((x) => `<div class="b" title="${x.gun}: ${x.giris} giriş, ${x.hatali} hatalı, ${x.goruntuleme} liste görüntüleme"><div class="col"><div class="g" style="height:${(x.giris / max) * 100}%"></div><div class="h" style="height:${(x.hatali / max) * 100}%"></div></div>${x.gun}</div>`).join('')}</div></div>
        <div class="card"><h3>Kullanıcılar (unvan)</h3>${hb(Object.fromEntries(Object.entries(d.unvanlar).map(([k, n]) => [TITLE[k] || k, n])))}</div>
        <div class="card"><h3>Açık oturumlar · cihaz</h3>${hb(d.cihaz.tur)}<h3 style="margin-top:12px">İşletim sistemi</h3>${hb(d.cihaz.os)}<h3 style="margin-top:12px">Tarayıcı</h3>${hb(d.cihaz.tarayici)}</div>
        <div class="card"><h3>En aktif (7 gün)</h3><table>${d.enAktif.map((x) => `<tr><td>${esc(x.ad)} ${tag(x.unvan)}</td><td class="nw">${x.n} işlem</td></tr>`).join('') || '<tr><td class="mut">Kayıt yok</td></tr>'}</table>
          ${d.sonYayin ? `<h3 style="margin-top:14px">Son yayın</h3><p>${esc(d.sonYayin.kim)} · ${when(d.sonYayin.tarih)} · ${d.sonYayin.kisi} kişi</p>` : ''}</div>
      </div>`);
  };
  M('<p class="mut">Yükleniyor…</p>'); await load(); timer = setInterval(load, 30000);
}

async function logView() {
  M(`<div class="top"><h2>Canlı loglar</h2><span class="live"><i></i>5 sn'de bir yenilenir</span></div>
    <div class="filters"><input id="fq" placeholder="Kişi, ayrıntı ya da IP ara" style="min-width:240px"><select id="fi"><option value="">Tüm işlemler</option>${Object.entries(ACT).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select><button class="btn" id="fr">Uygula</button></div>
    <div class="tw"><table><thead><tr><th>Zaman</th><th>Kim</th><th>İşlem</th><th>Ayrıntı</th><th>IP</th><th>Cihaz / tarayıcı</th><th></th></tr></thead><tbody id="lb"></tbody></table></div>`);

    if (bad) { const pp = bad.dataset.kaynak === 'pp'; if (!confirm(`${pp ? 'Bu profil fotoğrafı kaldırılsın' : 'Bu dosya silinsin'} ve ${bad.dataset.adi || 'kişi'} için uygunsuz içerik uyarısı sayılsın mı? (3. uyarıda otomatik askıya alınır)`)) return; try { const j = await api('dev-dosya-sil', { kaynak: bad.dataset.kaynak || 'dosya', id: +bad.dataset.fbad, uygunsuz: true }); if (j.askiya) alert('İçerik kaldırıldı ve kişi otomatik askıya alındı (3 uyarı).'); else if (j.uyari) alert(`İçerik kaldırıldı · ${bad.dataset.adi}: ${j.uyari}. uyarı.`); load(); } catch (err) { alert(err.message); } return; }
    const fd = e.target.closest('[data-fdel]');
    if (fd) { if (!confirm('Dosya silinsin mi?')) return; const [k, id] = fd.dataset.fdel.split(':'); try { await api('dev-dosya-sil', { kaynak: k, id: +id }); load(); } catch (err) { alert(err.message); } }
  });
  $('#ftabs').addEventListener('click', (e) => { const b = e.target.closest('[data-sek]'); if (!b) return; sek = fsek = b.dataset.sek; document.querySelectorAll('.ftab').forEach((x) => x.classList.toggle('on', x.dataset.sek === sek)); sayfa = 1; load(); });
  $('#fp').addEventListener('click', () => { if (sayfa > 1) { sayfa--; load(); } });
  $('#fnx').addEventListener('click', () => { sayfa++; load(); });
  await load();
}

async function guv() {
  M('<p class="mut">Yükleniyor…</p>'); let d; try { d = await api('dev-guvenlik'); } catch (e) { return fail(e); }
  const ipRows = (arr, cols) => arr.map((r) => `<tr><td class="mono">${esc(r.ip)}</td><td>${r.n}</td>${cols ? `<td class="nw">${when(r.son)}</td>` : ''}<td><button class="btn sm red" data-ban="${esc(r.ip)}">Engelle</button></td></tr>`).join('') || `<tr><td colspan="4" class="mut">Kayıt yok</td></tr>`;
  M(`<div class="top"><h2>Güvenlik</h2></div>
    <div class="grid2">
      <div class="card"><h3>IP engelle</h3><div class="filters"><input id="bip" placeholder="IP adresi" class="mono"><input id="bwhy" placeholder="Sebep"><select id="bh"><option value="1">1 saat</option><option value="24" selected>24 saat</option><option value="168">7 gün</option><option value="0">Kalıcı</option></select><button class="btn pri" id="bgo">Engelle</button></div>
        <table><thead><tr><th>IP</th><th>Sebep</th><th>Bitiş</th><th></th></tr></thead><tbody>${d.banlar.map((b) => `<tr><td class="mono">${esc(b.ip)}</td><td>${esc(b.sebep || '')}<br><span class="mut">${when(b.tarih)}</span></td><td class="nw">${b.bitis ? when(b.bitis) : 'Kalıcı'}${b.aktif ? '' : ' <span class="mut">(bitti)</span>'}</td><td><button class="btn sm" data-unban="${esc(b.ip)}">Kaldır</button></td></tr>`).join('') || '<tr><td colspan="4" class="mut">Engelli IP yok</td></tr>'}</tbody></table></div>
      <div class="card"><h3>Hatalı girişler (24 sa, IP)</h3><table><thead><tr><th>IP</th><th>Deneme</th><th>Son</th><th></th></tr></thead><tbody>${ipRows(d.hataliIp, true)}</tbody></table></div>
      <div class="card"><h3>Giriş denemeleri (son 1 sa, IP)</h3><table><thead><tr><th>IP</th><th>Deneme</th><th></th></tr></thead><tbody>${ipRows(d.denemeIp1s, false)}</tbody></table></div>
      <div class="card"><h3>Aşırı istek (24 sa)</h3><table><thead><tr><th>IP</th><th>Dakika</th><th>Son</th><th></th></tr></thead><tbody>${ipRows(d.asiriIstek, true)}</tbody></table></div>
      <div class="card"><h3>Kilitli / hatalı deneme yapan hesaplar</h3><table>${d.kilitli.map((k) => `<tr><td>${esc(k.ad)} ${tag(k.unvan)}</td><td>${k.hatali} hatalı</td><td class="nw">${k.kilit ? 'kilit: ' + when(k.kilit) : ''}</td></tr>`).join('') || '<tr><td class="mut">Yok</td></tr>'}</table></div>
      <div class="card"><h3>Koruma kuralları</h3><ul style="margin:0;padding-left:18px">${d.kurallar.map((k) => `<li>${esc(k)}</li>`).join('')}</ul></div>
    </div>`);
  $('#bgo').addEventListener('click', async () => { try { await api('dev-ban', { ip: $('#bip').value.trim(), sebep: $('#bwhy').value.trim(), saat: +$('#bh').value }); guv(); } catch (e) { alert(e.message); } });
  $('#m').onclick = async (e) => { const u = e.target.closest('[data-unban]'); if (u) { try { await api('dev-ban-sil', { ip: u.dataset.unban }); guv(); } catch (err) { alert(err.message); } return; } if (e.target.closest('[data-ban]')) { await banClick(e); guv(); } };
}
async function ai() {
  M('<p class="mut">Yükleniyor…</p>'); let d; try { d = await api('dev-ai'); } catch (e) { return fail(e); }
  const durum = d.tanimli
    ? `<div class="card ok"><b>✅ Anahtar tanımlı</b> — <b>${esc(d.saglayici)}</b> <span class="mono">${esc(d.maske)}</span> ile isimler yapay zekâ ile okunuyor.${d.kaynak === 'config' ? ' <span class="mut">(Kaynak: ccn-config.php — panelden değiştirilemez.)</span>' : ''}</div>`
    : `<div class="card err"><b>⚠️ Anahtar yok</b> — şu an isimler zayıf cihaz okumasıyla çıkarılıyor (hatalı olabilir). Aşağıya bir anahtar yapıştırıp kaydet.</div>`;
  M(`<div class="top"><h2>Yapay zekâ (isim okuma)</h2></div>
    <div class="card"><h3>Fotoğraftan liste okuma</h3>
      <p style="margin:0 0 8px"><b>${d.fotoOkuma ? '🟢 Açık' : '🔴 Kapalı'}</b> — ${d.fotoOkuma ? 'yöneticiler liste fotoğrafı yükleyip otomatik okutabiliyor.' : 'uygulama liste fotoğrafı kabul etmiyor; yeni liste "Yayın geçmişi → Liste içe aktar" ile yayınlanır.'}</p>
      <button class="btn${d.fotoOkuma ? ' red' : ' pri'}" id="fo-tog">${d.fotoOkuma ? 'Kapat' : 'Aç'}</button></div>
    <div class="card"><h3>⭐ Nova (Nöbet ve Vardiya Asistanı)</h3>
      <p style="margin:0 0 8px"><b>${d.luci ? '🟢 Açık' : '🔴 Kapalı'}</b>${d.luci ? ' — anahtar: ' + esc(d.luciKaynak) : ' — Gemini anahtarı girilince Nova uygulamanın sağ altında konuşmaya başlar.'}</p>
      <p class="mut" style="margin:0 0 8px">Nova yalnızca Gemini (ücretsiz) anahtarıyla çalışır: <b>aistudio.google.com/apikey</b>. Boş bırakılırsa, isim okuma anahtarı Gemini ise o kullanılır.</p>
      <div class="filters"><input id="lk-in" class="mono" placeholder="AQ... ya da AIza..." autocomplete="off" style="min-width:240px"><button class="btn pri" id="lk-save">Kaydet</button>${d.luci ? '<button class="btn" id="lk-test">Test et</button>' : ''}</div>
      <p class="mut" id="lk-msg"></p></div>
    <div class="card"><h3>Claude erişim anahtarı</h3>
      <p class="mut" style="margin:0 0 8px">Listeleri Claude'un senin yerine yayınlayabilmesi için 30 gün geçerli bir anahtar üretir. Anahtarı yalnızca Claude'un açtığı güvenli forma yapıştır, sohbete yazma. İstediğin an "Oturumlar" sayfasından kapatabilirsin.</p>
      <button class="btn" id="ea-gen">Anahtar üret</button><div id="ea-out" style="margin-top:8px"></div></div>
    ${durum}
    <div class="card">
      <h3>API anahtarı</h3>
      <p class="mut">Fotoğraftaki vardiya listesinde isimleri doğru okumak için gerekir. İki seçenekten birini kullanabilirsin — anahtarın başına bakıp hangisi olduğunu kendi anlar:</p>
      <ul style="margin:0 0 8px;padding-left:18px">
        <li><b>Gemini — ÜCRETSİZ:</b> <b>aistudio.google.com/apikey</b> → “Create API key”. Google ne verirse onu yapıştır. Ücretsiz katman çoğu kullanım için yeter.</li>
        <li><b>Claude (Anthropic) — ücretli:</b> <b>console.anthropic.com → API Keys</b> (<span class="mono">sk-ant-…</span>).</li>
      </ul>
      <p class="mut">Anahtar sunucuda güvenli saklanır, kimseye gösterilmez.</p>
      ${d.configKilit ? '<p class="mut">Not: Anahtar sunucu dosyasında tanımlı olduğundan buradan düzenlenemez.</p>' : `
      <div class="filters">
        <input id="aik" type="text" placeholder="AIza... veya sk-ant-..." class="mono" name="ccn-ai-anahtar-x" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore="true" style="min-width:260px">
        <button class="btn pri" id="aisave">Kaydet</button>
        ${d.tanimli ? '<button class="btn" id="aitest">Test et</button>' : ''}
        ${d.tanimli && d.kaynak === 'panel' ? '<button class="btn red" id="aidel">Anahtarı sil</button>' : ''}
      </div>
      <p class="mut" id="aimsg"></p>`}
      <div class="filters" style="margin-top:8px">
        <input id="aimodel" class="mono" value="${esc(d.model)}" placeholder="model adı" autocomplete="off" style="min-width:220px">
        <button class="btn" id="aimodelsave">Modeli kaydet</button>
      </div>
      <p class="mut">Hızlı seçenekler (dokunup kaydet): <a href="#" data-model="gemini-3.8-flash">gemini-3.8-flash</a> · <a href="#" data-model="gemini-flash-lite-latest">gemini-flash-lite-latest</a> · <a href="#" data-model="gemini-flash-latest">gemini-flash-latest</a> · <a href="#" data-model="claude-sonnet-5-5">claude-sonnet-5-5</a></p>
      <p class="mut" id="aimodelmsg"></p>
    </div>
    <div class="card"><h3>Test</h3><p class="mut">Kaydettikten sonra uygulamadan/siteden bir vardiya listesi fotoğrafı yükle. İsimlerin üstünde <b>“İsimler yapay zekâ ile okundu”</b> yazısını görürsen çalışıyor demektir.</p></div>`);
  $('#ea-gen').addEventListener('click', async () => {
    if (!confirm('30 gün geçerli yeni bir erişim anahtarı üretilsin mi?')) return;
    try { const r = await api('dev-erisim-anahtari', {}); $('#ea-out').innerHTML = `<input class="mono" readonly value="${esc(r.anahtar)}" style="width:100%" id="ea-val"><div class="filters" style="margin-top:6px"><button class="btn pri" id="ea-copy">Kopyala</button></div><p class="mut">Bu anahtar bir daha gösterilmez.</p>`;
      $('#ea-copy').addEventListener('click', async () => { const v = $('#ea-val'); v.select(); try { await navigator.clipboard.writeText(v.value); } catch (e) { document.execCommand('copy'); } $('#ea-copy').textContent = 'Kopyalandı ✓'; });
    } catch (e) { alert(e.message); }
  });
  $('#lk-save').addEventListener('click', async () => { const m = $('#lk-msg'); m.textContent = 'Kaydediliyor…'; try { await api('dev-luci-anahtar', { anahtar: $('#lk-in').value.trim() }); ai(); } catch (e) { m.textContent = e.message; } });
  const lkt = $('#lk-test'); if (lkt) lkt.addEventListener('click', async () => { const m = $('#lk-msg'); m.textContent = 'Test ediliyor…'; try { const r = await api('dev-luci-test'); m.textContent = r.ok ? `✅ Nova çalışıyor — ${r.model} (${r.sure} sn): “${r.cevap}”` : '❌ ' + r.hata; } catch (e) { m.textContent = e.message; } });
  $('#fo-tog').addEventListener('click', async () => { try { await api('dev-foto-okuma', { acik: !d.fotoOkuma }); ai(); } catch (e) { alert(e.message); } });
  if (d.configKilit) return;
  $('#aisave').addEventListener('click', async () => {
    const v = $('#aik').value.trim(); const msg = $('#aimsg');
    if (!v) { msg.textContent = 'Önce anahtarı yapıştır.'; return; }
    msg.textContent = 'Kaydediliyor…';
    try { await api('dev-ai-kaydet', { anahtar: v }); msg.textContent = 'Kaydedildi.'; ai(); } catch (e) { msg.textContent = e.message; }
  });
  const test = $('#aitest'); if (test) test.addEventListener('click', async () => {
    const msg = $('#aimsg'); msg.textContent = 'Test ediliyor…';
    try {
      const r = await api('dev-ai-test');
      msg.textContent = (r.adim1 ? '1) ' + r.adim1 + ' — ' : '') + '2) ' + (r.adim2 || r.hata || '') + ` · ${r.model}`
        + (r.ok ? ' — Artık fotoğraftan isimler okunabilir.' : '');
    } catch (e) { msg.textContent = e.message; }
  });
  const saveModel = async (m) => {
    const mm = $('#aimodelmsg'); mm.textContent = 'Kaydediliyor…';
    try { const r = await api('dev-ai-model', { model: m }); mm.textContent = 'Model kaydedildi: ' + r.model + '. Şimdi "Test et"e bas.'; const inp = $('#aimodel'); if (inp) inp.value = r.model; } catch (e) { mm.textContent = e.message; }
  };
  const ms = $('#aimodelsave'); if (ms) ms.addEventListener('click', () => saveModel($('#aimodel').value.trim()));
  document.querySelectorAll('[data-model]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const inp = $('#aimodel'); if (inp) inp.value = a.dataset.model; saveModel(a.dataset.model); }));
  const del = $('#aidel'); if (del) del.addEventListener('click', async () => {
    if (!confirm('Anahtar silinsin mi? İsim okuma tekrar zayıflar.')) return;
    try { await api('dev-ai-kaydet', { anahtar: '' }); ai(); } catch (e) { alert(e.message); }
  });
}
async function luciView() {
  const tr = (d) => when(d);
  const load = async (q) => {
    let d; try { d = await api('dev-luci&q=' + encodeURIComponent(q || '')); } catch (e) { return fail(e); }
    $('#lu-list').innerHTML = d.kisiler.length ? `<table><thead><tr><th>Kişi</th><th>Mesaj</th><th>Son</th><th></th></tr></thead><tbody>${d.kisiler.map((k) => `<tr><td>${esc(k.ad)} ${tag(k.unvan)}</td><td>${k.n}</td><td class="nw">${tr(k.son)}</td><td><button class="btn sm" data-lk="${k.id}">Sohbeti aç</button></td></tr>`).join('')}</tbody></table>` : '<p class="mut">Kayıt yok.</p>';
    $('#lu-say').textContent = `${d.toplam} mesaj · ${d.kisiler.length} kişi${q ? ' (arama: “' + q + '”)' : ''}`;
  };
  M(`<div class="top"><h2>⭐ Nova sohbetleri</h2></div>
    <div class="card"><p class="mut" style="margin:0 0 8px">Kişilerin Nova ile konuşmaları kişiye özeldir; yalnızca bu panelde görünür. Kişi adına ya da mesaj içeriğine göre ara.</p>
      <div class="filters"><input id="lu-q" placeholder="Ad ya da mesajda geçen kelime"><button class="btn pri" id="lu-ara">Ara</button></div><p class="mut" id="lu-say"></p></div>
    <div class="tw" id="lu-list"><p class="mut">Yükleniyor…</p></div>`);
  $('#lu-ara').addEventListener('click', () => load($('#lu-q').value.trim()));
  $('#lu-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') load($('#lu-q').value.trim()); });
  $('#m').onclick = async (e) => {
    const b = e.target.closest('[data-lk]'); if (!b) return;
    try {
      const d = await api('dev-luci&kisi=' + b.dataset.lk); const q = $('#lu-q').value.trim().toLocaleLowerCase('tr');
      const mark = (t) => { const x = esc(t).replace(/\n/g, '<br>'); return q ? x.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (w) => `<mark>${w}</mark>`) : x; };
      const box = document.createElement('div'); box.className = 'modal';
      box.innerHTML = `<div><div class="top"><h2>${esc(d.kisi.ad)} ${tag(d.kisi.unvan)} · ${d.mesajlar.length} mesaj</h2><button class="btn" data-close>Kapat</button></div>
        <div style="display:grid;gap:8px">${d.mesajlar.map((m) => `<div class="card" style="margin:0;${m.rol === 'luci' ? '' : 'border-left:3px solid var(--acc,#3b82f6)'}"><div class="mut" style="font-size:12px">${m.rol === 'luci' ? '⭐ Nova' : '👤 ' + esc(d.kisi.ad)} · ${when(m.tarih)}</div><div>${mark(m.metin)}</div></div>`).join('')}</div></div>`;
      box.addEventListener('click', (ev) => { if (ev.target === box || ev.target.closest('[data-close]')) box.remove(); }); document.body.appendChild(box);
    } catch (err) { alert(err.message); }
  };
  load('');
}
