name: Android APK

on:
  push:
    branches: [main, vardiya-panosu]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
        env:
          # uygulama bu sunucuya bağlanır (ilki çalışmazsa ikincisi): giriş, yayınlanan liste, duyurular
          CCN_API_URL: https://vardiyahazirla.com/api.php,https://srv2025553.hstgr.cloud/api.php,https://vardiya.179-198-217-149.sslip.io/api.php
      - name: APK ve Play paketi (AAB) derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug bundleRelease --no-daemon
      - name: APK adlandır
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "VardiyaPanosu-$VERSION-${GITHUB_RUN_NUMBER}.apk"
          # imzasız Play paketi; yükleme anahtarıyla depo dışında imzalanır
          cp android/app/build/outputs/bundle/release/app-release.aab "VardiyaPanosu-$VERSION-${GITHUB_RUN_NUMBER}-imzasiz.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: vardiya-panosu-apk
          path: |
            VardiyaPanosu-*.apk
            VardiyaPanosu-*.aab
      - name: APK'yı ayrı dala koy
        run: |
          mkdir /tmp/apkbranch && cp VardiyaPanosu-*.apk VardiyaPanosu-*.aab /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b vardiya-panosu-apk
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "APK ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" vardiya-panosu-apk
