name: iOS TestFlight

# Commit mesajında [testflight] varsa çalışır: iPhone uygulaması GitHub'ın Mac makinesinde imzalanıp
# App Store Connect'e (TestFlight) yüklenir. Anahtar kimliği, ekip ve Issuer kimliği gizli değildir, burada yazılı;
# yalnızca anahtar dosyasının içeriği depo ayarlarında (Settings → Secrets → Actions) gizli kayıt olarak durur: ASC_KEY_P8
on:
  push:
    branches: [main, vardiya-panosu]

jobs:
  testflight:
    if: contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: XSN73M763K
      ASC_ISSUER_ID: de2ddb00-9229-4f41-8c19-cf625d3d175c
      APPLE_TEAM_ID: ZT67S2LPV2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web dosyalarını iPhone projesine kopyala
        run: node tools/build.mjs && npx cap sync ios
      - name: API anahtarını yerleştir
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$APPLE_TEAM_ID" && test -n "$ASC_KEY_P8" || { echo "ASC_KEY_P8 gizli kaydı depo ayarlarında yok"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Arşivle (imzalı)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # derleme numarası her yüklemede artmalı
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            archive | tail -60
          test "${PIPESTATUS[0]}" -eq 0
      - name: App Store Connect'e yükle (TestFlight)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60
          test "${PIPESTATUS[0]}" -eq 0
      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
