/* Düzen: tek sütunlu uygulama kabuğu, mobilde alt sekme çubuğu, masaüstünde üst sekmeler; vardiya renkleri pano etiketleri gibi */
:root {
  --bg: #efebe2;
  --surface: #faf7f1;
  --surface-2: #f3eee4;
  --line: #ddd5c7;
  --fg: #17202b;
  --muted: #5b6876;
  --accent: #1f5f8b;
  --accent-fg: #ffffff;
  --s1: #c77700; --s1-bg: #fff3df;
  --s2: #0f7c74; --s2-bg: #dff4f1;
  --s3: #4b4fb8; --s3-bg: #e6e7fb;
  --off: #d32f2f; --off-bg: #fde3e3;
  --rap: #8a3fa8; --rap-bg: #f3e4f9;
  --yi: #2e7d32; --yi-bg: #e2f3e3;
  --mi: #6b5a2e; --mi-bg: #f2ecdc;
  --unk: #8a96a3; --unk-bg: #efebe2;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(23, 32, 43, .06), 0 2px 8px rgba(23, 32, 43, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a2129; --surface-2: #212a34; --line: #2f3a46;
    --fg: #e6ebf0; --muted: #9aa7b4; --accent: #6fb1e0; --accent-fg: #0d1a24;
    --s1: #f0a63a; --s1-bg: #3a2a10; --s2: #4fc9bd; --s2-bg: #10332f; --s3: #9a9df2; --s3-bg: #24264d;
    --off: #ff6b6b; --off-bg: #451b1b; --rap: #d18cf0; --rap-bg: #3a2147; --yi: #74c779; --yi-bg: #1d3a1f;
    --mi: #d6c08a; --mi-bg: #3a3322; --unk: #7d8a97; --unk-bg: #212a34;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a2129; --surface-2: #212a34; --line: #2f3a46;
  --fg: #e6ebf0; --muted: #9aa7b4; --accent: #6fb1e0; --accent-fg: #0d1a24;
  --s1: #f0a63a; --s1-bg: #3a2a10; --s2: #4fc9bd; --s2-bg: #10332f; --s3: #9a9df2; --s3-bg: #24264d;
  --off: #ff6b6b; --off-bg: #451b1b; --rap: #d18cf0; --rap-bg: #3a2147; --yi: #74c779; --yi-bg: #1d3a1f;
  --mi: #d6c08a; --mi-bg: #3a3322; --unk: #7d8a97; --unk-bg: #212a34;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* Açılış animasyonu: logo (CCN + üç vardiya çubuğu) sahneye girer, çubuklar sırayla yanar, ekran büyüyerek kaybolur */
#intro { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #1b2633 0%, #0d131a 70%); color: #fff; cursor: pointer; }
/* hareketli ızgara ve renk bulutları */
.intro-grid { position: absolute; inset: -40%; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 46px 46px; transform: perspective(600px) rotateX(58deg) translateY(10%); animation: introGrid 3.2s linear both; opacity: 0; mask-image: radial-gradient(closest-side, #000 30%, transparent 85%); -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent 85%); }
.intro-glow { position: absolute; inset: -20%; animation: introSpin 10s linear infinite; }
.intro-glow i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; opacity: 0; animation: introGlowIn 1.6s ease-out forwards; }
.intro-glow i:nth-child(1) { left: -12%; top: 0; background: radial-gradient(circle, rgba(240,166,58,.24), transparent 62%); }
.intro-glow i:nth-child(2) { right: -12%; top: 12%; background: radial-gradient(circle, rgba(79,201,189,.22), transparent 62%); animation-delay: .2s; }
.intro-glow i:nth-child(3) { left: 12%; bottom: -18%; background: radial-gradient(circle, rgba(154,157,242,.24), transparent 62%); animation-delay: .4s; }
.intro-stage { position: relative; display: grid; justify-items: center; gap: 18px; }
/* harfler üç farklı yönden gelir, yere inince ışık halkası yayar */
.intro-word { position: relative; display: flex; gap: .05em; font: 700 clamp(84px, 27vw, 140px)/.9 var(--font-display); letter-spacing: .02em; }
.intro-word { perspective: 700px; }
.intro-word span { position: relative; display: inline-block; transform-origin: 50% 100%; text-shadow: 0 0 24px rgba(255,255,255,.18); animation: introDrop .62s cubic-bezier(.3,0,.4,1) var(--d) both, introSquash .38s ease-out calc(var(--d) + .62s) both; }
.intro-word span::after { content: ''; position: absolute; left: 50%; bottom: -.06em; width: 1.6em; height: .34em; margin-left: -.8em; border-radius: 50%; border: 3px solid var(--c); box-shadow: 0 0 16px var(--c); opacity: 0; transform: scale(.2); animation: introDust .6s ease-out calc(var(--d) + .6s) both; }
.intro-word span:nth-child(1) { --d: .15s; --c: #f0a63a; --ry: -70deg; }
.intro-word span:nth-child(2) { --d: .42s; --c: #4fc9bd; --ry: 0deg; }
.intro-word span:nth-child(3) { --d: .69s; --c: #9a9df2; --ry: 70deg; }
.intro-stage.shake { animation: introShake .32s ease-out; }
/* ışık taraması */
.intro-word::after { content: ''; position: absolute; inset: -10% -20%; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%); mix-blend-mode: overlay; transform: translateX(-120%); animation: introSweep .8s ease-in-out 2.75s both; pointer-events: none; }
/* alttaki üç renk: farklı yönlerden gelen ışık çizgileri hapa dönüşür */
.intro-pills { display: flex; gap: clamp(10px, 3vw, 16px); }
.intro-pills i { position: relative; display: block; overflow: hidden; width: clamp(52px, 16vw, 80px); height: clamp(20px, 6vw, 28px); border-radius: 999px; background: var(--c); box-shadow: 0 0 0 0 var(--g); animation: var(--a) .6s cubic-bezier(.2,.9,.3,1) var(--d) both, introPulse .55s ease-in-out calc(var(--d) + .75s) both; }
.intro-pills i::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); transform: translateX(-100%); opacity: 0; animation: introSheen .7s ease-out calc(var(--d) + .5s) both; }
.intro-pills i:nth-child(1) { --c: #f0a63a; --g: rgba(240,166,58,.7); --a: introStreakL; --d: 1.0s; }
.intro-pills i:nth-child(2) { --c: #4fc9bd; --g: rgba(79,201,189,.7); --a: introStreakT; --d: 1.15s; }
.intro-pills i:nth-child(3) { --c: #9a9df2; --g: rgba(154,157,242,.7); --a: introStreakR; --d: 1.3s; }
.intro-name { font: 600 19px/1 var(--font-display); text-transform: uppercase; color: rgba(255,255,255,.85); animation: introName .9s cubic-bezier(.2,.8,.2,1) 1.45s both; }
/* yükleme çubuğu: parlayan uç, kayan ışık, kıvılcımlar ve yüzde sayacı */
.intro-load { width: min(330px, 76vw); display: grid; gap: 8px; margin-top: 34px; padding-right: 30px; box-sizing: border-box; animation: introFade .4s ease .85s both; }
.intro-bar { position: relative; height: 10px; border-radius: 10px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); overflow: visible; }
.intro-bar::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,.07) 22px 24px); }
.intro-bar b { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: inherit; background: linear-gradient(90deg, #f0a63a, #4fc9bd 55%, #9a9df2); background-size: 200% 100%; transform: scaleX(var(--p, 0)); transform-origin: left; box-shadow: 0 0 18px rgba(79,201,189,.55); animation: introFlow 1.2s linear infinite; }
.intro-bar b::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: introShine 1s linear infinite; }
.intro-walk { position: absolute; left: 0; right: 0; bottom: 100%; height: 26px; pointer-events: none; }
.iw { position: absolute; bottom: 1px; left: calc(var(--x, 0) * 100%); width: 14px; height: 24px; margin-left: -7px; opacity: 0; transition: opacity .2s; }
.iw.on { opacity: 1; } .iw.in { opacity: 0; transform: scale(.6) translateY(-2px); transition: opacity .25s, transform .25s; }
.iw svg { display: block; width: 14px; height: 24px; overflow: visible; animation: introBob .36s ease-in-out infinite; }
.iw .lg1, .iw .ar2 { transform-origin: 7px 14px; animation: introLeg .36s ease-in-out infinite alternate; }
.iw .lg2, .iw .ar1 { transform-origin: 7px 14px; animation: introLeg .36s ease-in-out infinite alternate-reverse; }
.iw .ar1, .iw .ar2 { transform-origin: 7px 9px; }
.intro-door { position: absolute; right: -36px; bottom: -6px; width: 34px; height: 36px; }
.intro-door .lit { fill: #ffd27a; opacity: .25; transition: opacity .15s; } .intro-door.flash .lit { opacity: 1; }


.intro-ver { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); text-align: center; font: 600 12px/1 var(--font-body); letter-spacing: .12em; color: rgba(255,255,255,.45); animation: introFade .5s ease 1.6s both; }
.intro-meta { display: flex; justify-content: space-between; align-items: baseline; font: 600 12px/1 var(--font-body); color: rgba(255,255,255,.7); letter-spacing: .04em; }
.intro-meta b { font: 700 15px/1 var(--font-display); color: #fff; font-variant-numeric: tabular-nums; }
#intro.out { animation: introOut .65s cubic-bezier(.6,0,.4,1) forwards; pointer-events: none; }
#intro.out .intro-stage { animation: introStageOut .65s cubic-bezier(.6,0,.4,1) forwards; }
#intro.out::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.35), transparent 60%); animation: introFlash .5s ease-out forwards; }
body.intro-run .topbar, body.intro-run #app { opacity: 0; }
body.intro-done .topbar { animation: introFade .35s ease both; }
body.intro-done #app { animation: introAppIn .4s cubic-bezier(.2,.8,.2,1) .05s both; }
@keyframes introDrop { 0% { opacity: 0; transform: translateY(-75vh) rotateX(-80deg) rotateY(var(--ry)) scale(1.5); filter: blur(10px); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: none; filter: none; } }
@keyframes introSquash { 0% { transform: scale(1.18, .78); } 45% { transform: scale(.94, 1.08); } 100% { transform: none; } }
@keyframes introDust { 0% { opacity: .95; transform: scale(.2); } 100% { opacity: 0; transform: scale(1.7); } }
@keyframes introShake { 20% { transform: translate(-3px, 2px); } 45% { transform: translate(3px, -2px); } 70% { transform: translate(-2px, 1px); } 100% { transform: none; } }
@keyframes introBob { 50% { transform: translateY(-1.5px); } }
@keyframes introLeg { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
@keyframes introSweep { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
@keyframes introStreakL { from { opacity: 0; transform: translateX(-60vw) scaleX(4) scaleY(.15); } 60% { opacity: 1; transform: translateX(6px) scaleX(1.3) scaleY(.6); } to { opacity: 1; transform: none; } }
@keyframes introStreakT { from { opacity: 0; transform: translateY(-55vh) scaleY(.2) scaleX(.3); } 60% { opacity: 1; transform: translateY(4px) scaleY(1.4) scaleX(.8); } to { opacity: 1; transform: none; } }
@keyframes introStreakR { from { opacity: 0; transform: translateX(60vw) scaleX(4) scaleY(.15); } 60% { opacity: 1; transform: translateX(-6px) scaleX(1.3) scaleY(.6); } to { opacity: 1; transform: none; } }
@keyframes introSheen { to { transform: translateX(100%); } }
@keyframes introPulse { 50% { transform: translateY(-5px); box-shadow: 0 0 26px 6px var(--g); } }
@keyframes introName { from { opacity: 0; letter-spacing: .6em; filter: blur(6px); } to { opacity: 1; letter-spacing: .16em; filter: none; } }
@keyframes introFlow { to { background-position: -200% 0; } }
@keyframes introShine { from { background-position: -40% 0; } to { background-position: 140% 0; } }
@keyframes introSpark { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(-14px, 4px); } }
@keyframes introGrid { 0% { opacity: 0; background-position: 0 0; } 20% { opacity: 1; } 100% { opacity: .7; background-position: 0 138px; } }
@keyframes introFade { from { opacity: 0; } }
@keyframes introGlowIn { to { opacity: 1; } }
@keyframes introSpin { to { transform: rotate(360deg); } }
@keyframes introOut { to { opacity: 0; } }
@keyframes introStageOut { to { transform: scale(1.18); opacity: 0; filter: blur(4px); } }
@keyframes introFlash { from { opacity: 1; } to { opacity: 0; } }
@keyframes introAppIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  #intro *, #intro, #intro::after, #intro *::before, #intro *::after { animation-duration: .01s !important; animation-delay: 0s !important; }
  #intro.out { animation-duration: .3s !important; }
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1000px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { display: grid; grid-template-columns: repeat(3, 8px); gap: 3px; }
.brand-mark i { height: 22px; border-radius: 2px; }
.brand-mark i:nth-child(1) { background: var(--s1); } .brand-mark i:nth-child(2) { background: var(--s2); } .brand-mark i:nth-child(3) { background: var(--s3); }
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-family: var(--font-body); }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tab svg { width: 18px; height: 18px; }
.tab[aria-current="page"] { background: var(--surface-2); color: var(--accent); }

main { max-width: 1000px; margin: 0 auto; padding-block: 16px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
@media (max-width: 720px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
  .tab { flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 8px; flex: 1; }
  .tab svg { width: 22px; height: 22px; }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--off); border-color: var(--off); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .5; cursor: default; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
input[type="text"], input[type="number"], input[type="search"], input[type="date"], input[type="time"], input[type="tel"], input[type="password"], input:not([type]), select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-height: 40px; max-width: 100%; }
textarea { width: 100%; min-height: 120px; font-family: ui-monospace, monospace; font-size: 12px; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--s1-bg); border: 1px solid var(--s1); color: var(--fg); border-radius: var(--radius); padding: 10px 14px; }
.banner p { margin: 0; flex: 1 1 240px; }

/* Günlük görünüm */
.datebar { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
.datebar .iconbtn { flex: none; }
.datebar .dtitle { flex: 1 1 auto; min-width: 0; }
.datebar .dtitle h2 { overflow-wrap: anywhere; }
.datebar .dtitle h2 { font-size: 26px; font-weight: 700; }
.datebar .dtitle span { color: var(--muted); font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; min-height: 32px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .summary { gap: 6px; } .sumtile { padding: 8px; } .sumtile b { font-size: 24px; } }
.sumtile { border-radius: var(--radius); padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); }
.sumtile b { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; display: block; line-height: 1; }
.sumtile span { font-size: 12px; color: var(--muted); }
.shifts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 900px) { .shifts { grid-template-columns: 1fr; } }
.shift { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
.shift-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.shift-num { font-family: var(--font-display); font-weight: 700; font-size: 22px; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.shift[data-s="1"] .shift-num { background: var(--s1); } .shift[data-s="2"] .shift-num { background: var(--s2); } .shift[data-s="3"] .shift-num { background: var(--s3); }
.shift[data-s="1"] .shift-head { background: var(--s1-bg); } .shift[data-s="2"] .shift-head { background: var(--s2-bg); } .shift[data-s="3"] .shift-head { background: var(--s3-bg); }
.shift-head h3 { font-size: 19px; font-weight: 700; }
.shift-head .hrs { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.shift-head .grow { flex: 1; min-width: 0; }
.grp { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.grp:last-child { border-bottom: 0; }
.grp-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.grp-h .count { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.names { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.names li { padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
